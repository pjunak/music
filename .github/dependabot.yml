version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
    ignore:
      # Truncates the file when shrinking a tag that ends at EOF; the FLAC
      # metadata tests fail: https://github.com/Serial-ATA/lofty-rs/issues/731
      - dependency-name: "lofty"
        versions: ["0.25.4"]
    groups:
      utoipa:
        patterns:
          - "utoipa"
          - "utoipa-axum"
      shared-cargo-dependencies:
        patterns:
          - "*"
        group-by: dependency-name
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # The frontend is TypeScript; replace the default npm "javascript" label.
    labels:
      - "dependencies"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
