name: Build and dispatch

# Verifies and publishes the canonical Rust server + React SPA image, then
# hands its digest to the infrastructure repository's Deploy workflow.
#
# Required secret  : INFRA_DISPATCH_TOKEN  (fine-grained PAT on the infra repo)
# Required variable: INFRA_REPO            (e.g. pjunak/infra)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/verify.yml
    with:
      run_fuzz: false
      # The release job below compiles and smoke-tests this exact image once.
      run_container: false

  release:
    name: Build, verify, and publish image
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      image_ref: ${{ steps.promote.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          name="ghcr.io/${REPO,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha_ref=${name}:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Compile and load the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: music:test
          cache-from: type=gha,scope=music-release-image
          cache-to: type=gha,mode=max,scope=music-release-image,ignore-error=true

      - name: Boot under production resource limits and serve the SPA
        run: |
          container_id=$(docker run --detach --cpus 3 --memory 4g --publish 18000:8000 music:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          bash .github/scripts/verify-rust-image.sh music:test
          curl --fail --silent http://127.0.0.1:18000/api/health | \
            grep --quiet '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<!doctype html>'

      - name: Skip superseded main revisions
        id: current
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main revision exists; publication and deployment skipped.'
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This reuses the warm BuildKit graph from the local smoke build. It
      # exports the verified result with registry provenance but does not
      # repeat dependency or application compilation.
      - name: Publish the verified cached image
        if: steps.current.outputs.current == 'true'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.sha_ref }}
          cache-from: type=gha,scope=music-release-image

      - name: Promote the verified digest to latest
        if: steps.current.outputs.current == 'true'
        id: promote
        env:
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine the immutable digest of the published image"
            exit 1
          fi
          image_ref="${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "$image_ref"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

  output-release:
    name: Publish tested Linux speaker download
    needs: [verify, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/download-artifact@v8
        with:
          name: music-output-linux-x86_64
          path: dist/music-output
      - name: Publish the verified commit without replacing existing downloads
        run: node .github/scripts/publish-output.mts
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Hand the image to infra
    needs: release
    if: needs.release.outputs.image_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch infra's Deploy for music
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          IMAGE_REF: ${{ needs.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$INFRA_REPO" --ref main -f service=music -f image_ref="$IMAGE_REF"
          echo "Deploying \`$IMAGE_REF\`; result: https://github.com/$INFRA_REPO/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
