name: Build and dispatch

# Verifies and publishes the canonical Rust server + React SPA image, then
# asks the infrastructure repository to deploy the exact source revision.
#
# Required secret  : INFRA_DISPATCH_TOKEN  (fine-grained PAT on the infra repo)
# Required variable: INFRA_REPO            (e.g. pjunak/junak.eu)
# Required variable: INFRA_SERVICE         (e.g. music)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/verify.yml
    with:
      run_fuzz: false
      # The release job below compiles and smoke-tests this exact image once.
      run_container: false

  release:
    name: Build, verify, and publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_ref: ${{ steps.promote.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          name="ghcr.io/${REPO,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha_ref=${name}:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Compile and load the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: music:test
          cache-from: type=gha,scope=music-release-image
          cache-to: type=gha,mode=max,scope=music-release-image,ignore-error=true

      - name: Boot under production resource limits and serve the SPA
        run: |
          container_id=$(docker run --detach --cpus 3 --memory 4g --publish 18000:8000 music:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          bash .github/scripts/verify-rust-image.sh music:test
          curl --fail --silent http://127.0.0.1:18000/api/health | \
            grep --quiet '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<!doctype html>'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This reuses the warm BuildKit graph from the local smoke build. It
      # exports the verified result with registry provenance but does not
      # repeat dependency or application compilation.
      - name: Publish the verified cached image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.sha_ref }}
          cache-from: type=gha,scope=music-release-image

      - name: Promote the verified digest to latest
        id: promote
        env:
          IMAGE_NAME: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine the immutable digest of the published image"
            exit 1
          fi
          image_ref="${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "$image_ref"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

  dispatch:
    name: Dispatch deploy to infra repo
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify dispatch config
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ vars.INFRA_REPO }}
          SERVICE: ${{ vars.INFRA_SERVICE }}
          IMAGE_REF: ${{ needs.release.outputs.image_ref }}
        run: |
          set -euo pipefail
          : "${TOKEN:?INFRA_DISPATCH_TOKEN secret is not set}"
          : "${REPO:?INFRA_REPO variable is not set (e.g. owner/infra-repo)}"
          : "${SERVICE:?INFRA_SERVICE variable is not set (e.g. music)}"
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Release job did not provide a valid immutable GHCR image reference"
            exit 1
          }

      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: deploy
          client-payload: |-
            {
              "service": "${{ vars.INFRA_SERVICE }}",
              "sha": "${{ github.sha }}",
              "image_ref": "${{ needs.release.outputs.image_ref }}"
            }
