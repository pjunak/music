name: Rust rewrite verification

on:
  workflow_dispatch:
  push:
    branches: ["rewrite/rust"]
  pull_request:
    branches: [main, "rewrite/rust"]

permissions:
  contents: read

concurrency:
  group: rust-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUSIC_TEST_FFMPEG: /usr/bin/ffmpeg
      MUSIC_TEST_FFPROBE: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Format, lint, test, and document
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings
          cargo test --workspace --all-features
          cargo test --workspace --all-features --doc
          cargo run --locked -p music-server --bin music-cli -- contracts check --root .

      - name: Install pinned dependency auditors
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml --locked check
          cargo audit --deny warnings
          cargo audit --file fuzz/Cargo.lock --deny warnings

  python-reference:
    name: Python compatibility oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify the frozen reference implementation
        run: |
          cd backend
          pip install uv
          uv sync --locked --extra dev
          uv run python -m app.reference_contracts --check
          uv run ruff check app tests
          uv run mypy app tests
          uv run pytest

  fuzz-smoke:
    name: Rust parser fuzz smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust and pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build and exercise every fuzz target
        run: |
          cargo +nightly fuzz build
          for target in protocol_json media_path authored_yaml authoring_import assistant_output; do
            cargo +nightly fuzz run "$target" -- \
              -runs=2000 \
              -max_len=65536 \
              -timeout=10 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
          done

  frontend:
    name: Frontend compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Test acceptance-report tooling
        run: node --test .github/scripts/voice-differential.test.mjs

      - name: Lint, typecheck, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  rust-container:
    name: Rust container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build the rewrite-only image
        run: docker build --file Dockerfile.rust --tag music-rust-rewrite:test .

      - name: Boot as non-root and serve the SPA
        run: |
          container_id=$(docker run --detach --cpus 3 --memory 4g --publish 18000:8000 music-rust-rewrite:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/readiness >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "music"
          docker run --rm --entrypoint sh music-rust-rewrite:test -c \
            '! command -v python && ! command -v python3'
          curl --fail --silent http://127.0.0.1:18000/api/health | \
            grep --quiet '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<!doctype html>'

  performance-baseline:
    name: Python to Rust runtime comparison
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install media fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Build the frozen production baseline
        run: |
          docker build \
            --build-arg INSTALL_VOICE_ANALYZER=true \
            --file Dockerfile \
            --tag music-python-baseline:test \
            .

      - name: Build the Rust candidate
        run: docker build --file Dockerfile.rust --tag music-rust-rewrite:test .

      - name: Compare resource and request paths
        run: |
          bash .github/scripts/compare-runtime.sh \
            music-python-baseline:test \
            music-rust-rewrite:test \
            runtime-performance.md

      - name: Publish the comparison summary
        if: always()
        run: |
          if [ -f runtime-performance.md ]; then
            cat runtime-performance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The runtime comparison failed before it could write a report." >> "$GITHUB_STEP_SUMMARY"
          fi
