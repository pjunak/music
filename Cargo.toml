[workspace]
members = [
    "crates/music-analysis",
    "crates/music-application",
    "crates/music-domain",
    "crates/music-media",
    "crates/music-output",
    "crates/music-protocol",
    "crates/music-server",
    "crates/music-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Music contributors"]

[workspace.dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.34"
lofty = "0.25.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["query", "rustls", "stream"] }
rpassword = "7.5.4"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize", "serialize"] }
same-file = "1.0.6"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "runtime-tokio", "sqlite"] }
tempfile = "3.23"
tar = "0.4.46"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tract-tensorflow = "0.23.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
utoipa = { version = "5.5.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.2.0"
unicode-normalization = "0.1.25"
unicode-casefold = "0.2.0"
unicode-general-category = "1.1.0"
uuid = { version = "1.26.0", features = ["v4"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
